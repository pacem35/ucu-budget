name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing key secret; APK will be debug-signed."
          fi

      - name: Unit tests
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest 2>&1 | tee test.log; exit ${PIPESTATUS[0]}

      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      # Surface compiler/Gradle errors as annotations so they're readable without the raw log.
      - name: Report errors
        if: failure()
        run: |
          cat test.log build.log 2>/dev/null \
            | grep -E "^e: |What went wrong|^> |error:|FAILED|AssertionError|Exception|Caused by|Could not|build.gradle:" \
            | grep -v "^> Task" | head -120 > errors.txt || true
          split -l 12 errors.txt chunk_
          for f in chunk_*; do
            msg=$(sed 's/%/%25/g' "$f" | awk '{printf "%s%%0A", $0}')
            echo "::error title=Build error::${msg}"
          done

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk "Tally-${GITHUB_RUN_NUMBER}.apk"
          cp app/build/outputs/apk/release/app-release.apk Tally-latest.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Tally-apk
          path: Tally-*.apk

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Latest build" --notes "Download Tally-latest.apk on your phone and install it."
          gh release edit latest --notes "Build #${GITHUB_RUN_NUMBER} from ${GITHUB_SHA::7}. Download Tally-latest.apk on your phone and install it."
          gh release upload latest Tally-latest.apk --clobber
